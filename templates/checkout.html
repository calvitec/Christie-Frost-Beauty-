<!DOCTYPE html>
<html>
<head>
    <title>Checkout — Christie Frost</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <h1 class="text-3xl font-bold text-green-700">✅ Checkout page works!</h1>
    <p class="mt-4">Total: ${{ total }}</p>
    <p>Items: {{ total_items }}</p>

    <h2 class="text-xl font-bold mt-6">Cart Items:</h2>
    {% for item in cart_items %}
    <p>{{ item.name }} — Qty: {{ item.quantity }} — ${{ item.price }}</p>
    {% endfor %}

    <a href="/cart" class="text-blue-600 underline mt-6 block">Back to cart</a>
</body>
</html>
